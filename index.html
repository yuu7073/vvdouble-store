<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>VV DOUBLE 門市營運中心</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #F4F5F7;
    color: #1F2430;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid #E3E5EA;
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .icon { width: 36px; height: 36px; margin: 0 auto 18px; display: block; }
  .icon path, .icon rect { fill: none; stroke: #1F2430; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .brand { font-size: 11px; letter-spacing: 2px; color: #6A7085; margin-bottom: 8px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 14px; }
  .chip {
    display: inline-block;
    font-size: 12.5px;
    padding: 5px 14px;
    border-radius: 999px;
    background: #1F2430;
    color: #fff;
    margin-bottom: 16px;
  }
  p { font-size: 12.5px; line-height: 1.8; color: #6A7085; }
</style>
</head>
<body>
  <main class="card">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="5" y="11" width="14" height="9" rx="2"></rect>
      <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
    </svg>
    <div class="brand">VV DOUBLE</div>
    <h1>門市營運中心</h1>
    <div class="chip">暫停使用</div>
    <p>系統調整中，恢復時間另行通知。</p>
  </main>
</body>
</html>
